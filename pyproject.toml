[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chrissandor-cadlab"
version = "6.1.0b1"
description = "Cross-platform CAD workspace and private PKI laboratory with signed project seals"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Chris Sandor" }]
dependencies = ["cryptography>=42"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cadlab = "cadlab.cli:main"

[tool.setuptools]
packages = ["cadlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
